<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Facelets Hello Greeting</title>
    </h:head>
    <h:body>

        <h:form id="formulario" >
            <p:card style="width: 25rem; margin-bottom: 2em">
                <f:facet name="title" >Gestionar Asignaturas</f:facet>

                <h:panelGrid columns="3">

                    <p:outputLabel for="txfCodigo" value="Codigo : "/>
                    <p:inputText id="txfCodigo" value="#{asignCtrl.asignatura.codigo}" required="true" ></p:inputText>
                    <p:message for="txfCodigo"></p:message>

                    <p:outputLabel for="txfNombre" value="Nombre : "/>
                    <p:inputText id="txfNombre" value="#{asignCtrl.asignatura.nombre}" required="true" ></p:inputText>
                    <p:message for="txfNombre"></p:message>

                    <p:outputLabel for="txfCreditos" value="Creditos : "/>
                    <p:inputNumber id="txfCreditos" value="#{asignCtrl.asignatura.creditos}" required="true" ></p:inputNumber>
                    <p:message for="txfCreditos"></p:message>

                    <p:outputLabel for="txfIntensidad" value="Intensidad : "/>
                    <p:inputNumber id="txfIntensidad" value="#{asignCtrl.asignatura.intensidad}" required="true" ></p:inputNumber>
                    <p:message for="txfIntensidad"></p:message>

                </h:panelGrid>


                <p:messages id="mensajes" globalOnly="true" closable="true" />

                <f:facet name="footer" >

                    <p:commandButton icon="pi pi-check" value="Guardar"
                                     action="#{asignCtrl.guardar()}"
                                     process="@this txfCodigo txfNombre txfCreditos txfIntensidad"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad tabla"/>
                                     
                    <p:commandButton icon="pi pi-times" value="Cancelar" 
                                     styleClass="ui-button-secondary" 
                                     style="margin-left: .5em"
                                     action="#{asignCtrl.cancelar()}"
                                     process="@this"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad"/>

                </f:facet>
            </p:card>
        </h:form>

        <p:dataTable id="tabla" value="#{asignCtrl.asignaturas}" var="obj" >
            <p:column headerText="Codigo">#{obj.codigo}</p:column>
            <p:column headerText="Nombre">#{obj.nombre}</p:column>
            <p:column headerText="Creditos">#{obj.creditos}</p:column>
            <p:column headerText="Intesidad">#{obj.intensidad}</p:column>
        </p:dataTable> 
            
    </h:body>
</html>
